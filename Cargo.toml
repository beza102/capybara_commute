[package]
name = "capybara_commute"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.14", features = ["default"] }
bevy_rapier2d = { version = "0.27", features = ["debug-render-2d"] }
rand = "0.8"

# Enable optimizations for dependencies even in debug mode
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
